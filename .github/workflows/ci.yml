name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Type-check Python
        run: npx --yes pyright@1.1.413 --level error
      - name: Check shell syntax
        run: sh -n install-skill.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill metadata
        run: python scripts/quick_validate.py .
